name: Check

on:
  pull_request:
    branches: [alpha, main]
  push:
    branches: [alpha, main]

jobs:
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Check for known vulnerabilities
        run: |
          echo "Checking for critical vulnerabilities..."
          npm audit --json > audit.json || true
          CRITICAL=$(cat audit.json | jq '.metadata.vulnerabilities.critical // 0')
          HIGH=$(cat audit.json | jq '.metadata.vulnerabilities.high // 0')
          echo "Critical: $CRITICAL, High: $HIGH"
          if [ "$CRITICAL" -gt 0 ]; then
            echo "::warning::Critical vulnerabilities found"
          fi

  determinism:
    name: Determinism Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run determinism tests
        run: npm run test:determinism

  wire-format:
    name: Wire Format Stability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check ABI encoding stability
        run: npm run test:vectors

  cross-platform:
    name: Cross-Platform (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test:unit

  chaos-resilience:
    name: Chaos Resilience
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run chaos tests (111 tests)
        run: npm run test:chaos

      - name: Verify no crashes on malformed input
        run: |
          echo "## Chaos Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Tests | Description |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|-------------|" >> $GITHUB_STEP_SUMMARY
          echo "| WSTFAuth Chaos | 49 | Token tampering, encoding, fuzz |" >> $GITHUB_STEP_SUMMARY
          echo "| Connector Chaos | 32 | Header chaos, auth flow |" >> $GITHUB_STEP_SUMMARY
          echo "| Mood Game | 30 | End-to-end integration |" >> $GITHUB_STEP_SUMMARY

  all-checks:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [security, determinism, wire-format, cross-platform, chaos-resilience]
    steps:
      - name: All checks passed
        run: echo "All checks passed successfully!"
