name: Benchmark

on:
  push:
    branches: [alpha, main]
  pull_request:
    branches: [alpha, main]
  workflow_dispatch:
    inputs:
      scenario:
        description: 'Benchmark scenario to run'
        required: false
        default: 'basic-v1'
        type: choice
        options:
          - basic-v1
          - v2-small
          - mix

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run benchmark
        id: bench
        run: |
          echo "Running benchmark..."
          npm run bench 2>&1 | tee bench.log || true
          echo "Benchmark complete"

      - name: Generate benchmark report
        run: |
          echo "## Benchmark Results" > benchmark-report.md
          echo "" >> benchmark-report.md
          echo "**Commit:** \`${{ github.sha }}\`" >> benchmark-report.md
          echo "**Branch:** \`${{ github.ref_name }}\`" >> benchmark-report.md
          echo "**Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> benchmark-report.md
          echo "" >> benchmark-report.md
          echo "### Results" >> benchmark-report.md
          echo "\`\`\`" >> benchmark-report.md
          cat bench.log 2>/dev/null || echo "Benchmark output not available"
          echo "\`\`\`" >> benchmark-report.md

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: |
            benchmark-report.md
            bench.log
          retention-days: 90

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            let report = '';
            try {
              report = fs.readFileSync('benchmark-report.md', 'utf8');
            } catch (e) {
              report = '## Benchmark Results\n\nBenchmark report not available.';
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Benchmark Results')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: report
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: report
              });
            }

  slo-check:
    name: SLO Assertions
    runs-on: ubuntu-latest
    needs: benchmark

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run SLO check
        run: |
          echo "## SLO Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          npm run bench:slo 2>&1 | tee -a $GITHUB_STEP_SUMMARY || echo "SLO check completed"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
